<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>规划流转</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone">
  <header id="topbar">
    <div class="brand">
      <span id="title" onclick="go('todo')" style="cursor:pointer">规划流转</span>
      <a href="report.html" class="help-dot" title="使用说明">?</a>
    </div>
    <div class="top-actions">
      <button type="button" class="top-pill" id="btnRules" onclick="rulesModal()">
        新规<span class="badge-dot hidden" id="ruleBadge">0</span>
      </button>
      <button type="button" class="top-pill" id="btnDirect" onclick="openDirectChannel()">
        直通车<span class="badge-dot hidden" id="directBadge">0</span>
      </button>
      <select id="userSwitch" aria-label="当前身份"></select>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabbar">
    <button data-go="todo">待办</button>
    <button data-go="projects">项目</button>
    <button data-go="new">＋ 新建</button>
  </nav>
</div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="toasts"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="modals.js"></script>
<script src="views.js"></script>
</body>
</html>
